name: pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the sources, the Go
  # version or one of the actions below has to prove the site still builds
  # before it lands. Without this the workflow ran only on main, so a
  # dependency bump arrived with no signal at all: its checks read "no checks",
  # which is not the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads. Publishing rights are granted to the deploy job alone, below, so a
# pull request build cannot replace what is served even if a step in it
# misbehaves.
permissions:
  contents: read
  pages: read

# Deploys serialise with one another under the main group; each pull request
# gets a group of its own, so it neither waits behind a deploy nor holds one
# up, and a new push supersedes the run still in flight for the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true

      - name: Build wui-wasm.wasm + stage site
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p site
          go build -o site/wui-wasm.wasm ./cmd/wui-wasm
          cp index.html site/index.html
          root="$(go env GOROOT)"
          if [ -f "$root/lib/wasm/wasm_exec.js" ]; then
            cp "$root/lib/wasm/wasm_exec.js" site/wasm_exec.js
          else
            cp "$root/misc/wasm/wasm_exec.js" site/wasm_exec.js
          fi
          ls -la site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    # Only main publishes. A pull request stops after the build above: it has
    # proved the site builds, which is the whole point of the gate, and it has
    # no business replacing the published site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
